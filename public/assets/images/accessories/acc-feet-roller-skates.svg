<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100">
  <!-- Roller Skates (pair) -->
  <style>
    svg { color: #4A90E2; }
  </style>

  <!-- Left skate boot -->
  <rect x="10" y="30" width="60" height="35" fill="currentColor" stroke="#000" stroke-width="3" rx="8"/>
  <rect x="15" y="35" width="50" height="15" fill="#fff" fill-opacity="0.3" stroke="#000" stroke-width="2" rx="4"/>

  <!-- Left skate wheels -->
  <circle cx="25" cy="75" r="10" fill="#FFD700" stroke="#000" stroke-width="2"/>
  <circle cx="45" cy="75" r="10" fill="#FFD700" stroke="#000" stroke-width="2"/>
  <circle cx="60" cy="75" r="10" fill="#FFD700" stroke="#000" stroke-width="2"/>

  <!-- Right skate boot -->
  <rect x="110" y="30" width="60" height="35" fill="currentColor" stroke="#000" stroke-width="3" rx="8"/>
  <rect x="115" y="35" width="50" height="15" fill="#fff" fill-opacity="0.3" stroke="#000" stroke-width="2" rx="4"/>

  <!-- Right skate wheels -->
  <circle cx="125" cy="75" r="10" fill="#FFD700" stroke="#000" stroke-width="2"/>
  <circle cx="145" cy="75" r="10" fill="#FFD700" stroke="#000" stroke-width="2"/>
  <circle cx="160" cy="75" r="10" fill="#FFD700" stroke="#000" stroke-width="2"/>
</svg>
