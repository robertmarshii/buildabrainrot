<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Beanie Hat -->
  <style>
    svg { color: #FF6B6B; }
  </style>
  <!-- Main beanie -->
  <ellipse cx="100" cy="70" rx="80" ry="50" fill="currentColor" stroke="#000" stroke-width="3"/>

  <!-- Folded brim -->
  <rect x="20" y="65" width="160" height="25" fill="currentColor" stroke="#000" stroke-width="3" rx="5"/>
  <rect x="20" y="70" width="160" height="20" fill="#000" fill-opacity="0.2"/>

  <!-- Top pom-pom -->
  <circle cx="100" cy="25" r="18" fill="currentColor" stroke="#000" stroke-width="3"/>
  <circle cx="95" cy="20" r="6" fill="#fff" opacity="0.6"/>

  <!-- Texture lines -->
  <path d="M 40 50 Q 100 45 160 50" fill="none" stroke="#000" stroke-width="2" opacity="0.3"/>
  <path d="M 45 60 Q 100 55 155 60" fill="none" stroke="#000" stroke-width="2" opacity="0.3"/>
</svg>
