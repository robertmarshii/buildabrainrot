<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Cat Ears -->
  <style>
    svg { color: #808080; }
  </style>
  <!-- Left ear -->
  <path d="M 40 90 L 20 20 L 70 60 Z" fill="currentColor" stroke="#000" stroke-width="3"/>
  <!-- Left inner ear -->
  <path d="M 40 80 L 30 35 L 60 65 Z" fill="#FFB6C1" stroke="#000" stroke-width="2"/>

  <!-- Right ear -->
  <path d="M 160 90 L 180 20 L 130 60 Z" fill="currentColor" stroke="#000" stroke-width="3"/>
  <!-- Right inner ear -->
  <path d="M 160 80 L 170 35 L 140 65 Z" fill="#FFB6C1" stroke="#000" stroke-width="2"/>
</svg>
