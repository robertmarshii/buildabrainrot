  <path d="M 36 30 Q 40 30 42 35" fill="none" stroke="#000" stroke-width="1.5" opacity="0.4"/>

  <!-- Right horn -->
  <path d="M 150 80 Q 165 60 170 40 Q 172 20 165 15 Q 160 30 155 50 Q 152 70 150 80 Z" fill="currentColor" stroke="#000" stroke-width="3"/>
  <!-- Right horn ridges -->
  <path d="M 162 45 Q 158 45 156 50" fill="none" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <path d="M 164 30 Q 160 30 158 35" fill="none" stroke="#000" stroke-width="1.5" opacity="0.4"/>

  <!-- Highlights -->
