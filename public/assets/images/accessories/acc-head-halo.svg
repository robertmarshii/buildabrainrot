<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Halo - Angel ring above head -->
  <style>
    svg { color: #FFD700; }
  </style>
  <!-- Glow effect -->
  <ellipse cx="100" cy="20" rx="55" ry="12" fill="currentColor" opacity="0.3"/>

  <!-- Main ring -->
  <ellipse cx="100" cy="20" rx="50" ry="10" fill="none" stroke="currentColor" stroke-width="8"/>

  <!-- Shine highlights -->
  <ellipse cx="70" cy="18" rx="8" ry="3" fill="#fff" opacity="0.8"/>
  <ellipse cx="130" cy="18" rx="6" ry="2" fill="#fff" opacity="0.6"/>
</svg>
