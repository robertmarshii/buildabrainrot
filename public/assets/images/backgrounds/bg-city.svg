<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- City Street Background -->
  <!-- Sky -->
  <rect x="0" y="0" width="1920" height="600" fill="#87CEEB"/>

  <!-- Buildings (background) -->
  <rect x="0" y="150" width="300" height="450" fill="#708090" stroke="#2F4F4F" stroke-width="4"/>
  <rect x="300" y="200" width="250" height="400" fill="#778899" stroke="#2F4F4F" stroke-width="4"/>
  <rect x="550" y="100" width="350" height="500" fill="#696969" stroke="#2F4F4F" stroke-width="4"/>
  <rect x="1100" y="180" width="280" height="420" fill="#778899" stroke="#2F4F4F" stroke-width="4"/>
  <rect x="1380" y="120" width="320" height="480" fill="#708090" stroke="#2F4F4F" stroke-width="4"/>
  <rect x="1700" y="220" width="220" height="380" fill="#696969" stroke="#2F4F4F" stroke-width="4"/>

  <!-- Windows on buildings -->
  <g fill="#FFD700" opacity="0.8">
    <!-- Building 1 windows -->
    <rect x="30" y="200" width="40" height="50" rx="3"/>
    <rect x="90" y="200" width="40" height="50" rx="3"/>
    <rect x="150" y="200" width="40" height="50" rx="3"/>
    <rect x="210" y="200" width="40" height="50" rx="3"/>
    <rect x="30" y="280" width="40" height="50" rx="3"/>
    <rect x="90" y="280" width="40" height="50" rx="3"/>
    <rect x="150" y="280" width="40" height="50" rx="3"/>
    <rect x="210" y="280" width="40" height="50" rx="3"/>
    <rect x="30" y="360" width="40" height="50" rx="3"/>
    <rect x="90" y="360" width="40" height="50" rx="3"/>
    <rect x="150" y="360" width="40" height="50" rx="3"/>
    <rect x="210" y="360" width="40" height="50" rx="3"/>

    <!-- Building 2 windows -->
    <rect x="330" y="250" width="35" height="45" rx="3"/>
    <rect x="390" y="250" width="35" height="45" rx="3"/>
    <rect x="330" y="320" width="35" height="45" rx="3"/>
    <rect x="390" y="320" width="35" height="45" rx="3"/>
    <rect x="330" y="390" width="35" height="45" rx="3"/>
    <rect x="390" y="390" width="35" height="45" rx="3"/>

    <!-- Building 3 windows -->
    <rect x="590" y="150" width="45" height="55" rx="3"/>
    <rect x="660" y="150" width="45" height="55" rx="3"/>
    <rect x="730" y="150" width="45" height="55" rx="3"/>
    <rect x="800" y="150" width="45" height="55" rx="3"/>
    <rect x="590" y="240" width="45" height="55" rx="3"/>
    <rect x="660" y="240" width="45" height="55" rx="3"/>
    <rect x="730" y="240" width="45" height="55" rx="3"/>
    <rect x="800" y="240" width="45" height="55" rx="3"/>
    <rect x="590" y="330" width="45" height="55" rx="3"/>
    <rect x="660" y="330" width="45" height="55" rx="3"/>
    <rect x="730" y="330" width="45" height="55" rx="3"/>
    <rect x="800" y="330" width="45" height="55" rx="3"/>

    <!-- Building 4 windows -->
    <rect x="1130" y="230" width="40" height="50" rx="3"/>
    <rect x="1190" y="230" width="40" height="50" rx="3"/>
    <rect x="1250" y="230" width="40" height="50" rx="3"/>
    <rect x="1130" y="310" width="40" height="50" rx="3"/>
    <rect x="1190" y="310" width="40" height="50" rx="3"/>
    <rect x="1250" y="310" width="40" height="50" rx="3"/>
    <rect x="1130" y="390" width="40" height="50" rx="3"/>
    <rect x="1190" y="390" width="40" height="50" rx="3"/>
    <rect x="1250" y="390" width="40" height="50" rx="3"/>
  </g>

  <!-- Sidewalk -->
  <rect x="0" y="600" width="1920" height="150" fill="#A9A9A9"/>

  <!-- Street -->
  <rect x="0" y="750" width="1920" height="330" fill="#36454F"/>

  <!-- Road markings -->
  <rect x="900" y="770" width="120" height="30" fill="#FFD700" rx="5"/>
  <rect x="900" y="850" width="120" height="30" fill="#FFD700" rx="5"/>
  <rect x="900" y="930" width="120" height="30" fill="#FFD700" rx="5"/>
  <rect x="900" y="1010" width="120" height="30" fill="#FFD700" rx="5"/>

  <!-- Crosswalk stripes -->
  <rect x="100" y="700" width="80" height="50" fill="#fff"/>
  <rect x="220" y="700" width="80" height="50" fill="#fff"/>
  <rect x="340" y="700" width="80" height="50" fill="#fff"/>
  <rect x="460" y="700" width="80" height="50" fill="#fff"/>

  <!-- Traffic Light -->
  <rect x="1650" y="400" width="80" height="200" fill="#2F4F4F" stroke="#000" stroke-width="3" rx="8"/>
  <circle cx="1690" cy="450" r="25" fill="#DC143C"/>
  <circle cx="1690" cy="510" r="25" fill="#FFD700"/>
  <circle cx="1690" cy="570" r="25" fill="#32CD32" opacity="0.3"/>
  <!-- Traffic light pole -->
  <rect x="1680" y="600" width="20" height="150" fill="#2F4F4F" stroke="#000" stroke-width="2"/>

  <!-- Street Lamp -->
  <rect x="400" y="450" width="15" height="150" fill="#2F4F4F" stroke="#000" stroke-width="2"/>
  <path d="M 360 450 L 390 410 L 440 410 L 470 450 Z" fill="#2F4F4F" stroke="#000" stroke-width="2"/>
  <ellipse cx="415" cy="420" rx="50" ry="20" fill="#FFD700" opacity="0.5"/>

  <!-- Store Front -->
  <rect x="900" y="400" width="300" height="200" fill="#DC143C" stroke="#8B0000" stroke-width="4"/>
  <text x="1050" y="480" font-family="Arial" font-size="50" font-weight="bold" fill="#fff" text-anchor="middle">STORE</text>
  <rect x="930" y="510" width="110" height="80" fill="#4169E1" stroke="#000" stroke-width="3"/>
  <rect x="1070" y="510" width="110" height="80" fill="#4169E1" stroke="#000" stroke-width="3"/>

  <!-- Awning -->
  <path d="M 880 400 L 900 380 L 1200 380 L 1220 400 Z" fill="#FFD700" stroke="#DAA520" stroke-width="3"/>
  <line x1="920" y1="380" x2="920" y2="400" stroke="#DAA520" stroke-width="3"/>
  <line x1="990" y1="380" x2="990" y2="400" stroke="#DAA520" stroke-width="3"/>
  <line x1="1060" y1="380" x2="1060" y2="400" stroke="#DAA520" stroke-width="3"/>
  <line x1="1130" y1="380" x2="1130" y2="400" stroke="#DAA520" stroke-width="3"/>
  <line x1="1180" y1="380" x2="1180" y2="400" stroke="#DAA520" stroke-width="3"/>

  <!-- Fire Hydrant -->
  <rect x="220" y="650" width="60" height="80" fill="#DC143C" stroke="#8B0000" stroke-width="3" rx="8"/>
  <circle cx="250" cy="680" r="12" fill="#FFD700" stroke="#000" stroke-width="2"/>
  <rect x="200" y="730" width="100" height="20" fill="#DC143C" stroke="#8B0000" stroke-width="2" rx="4"/>

  <!-- Mailbox -->
  <rect x="1400" y="630" width="60" height="100" fill="#4169E1" stroke="#000080" stroke-width="3" rx="5"/>
  <circle cx="1430" cy="660" r="8" fill="#fff"/>
  <rect x="1405" y="640" width="50" height="3" fill="#fff"/>
</svg>
