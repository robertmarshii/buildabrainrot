<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Gaming Room Background -->
  <!-- Floor -->
  <rect x="0" y="650" width="1920" height="430" fill="#2C2C2C"/>

  <!-- Wall -->
  <rect x="0" y="0" width="1920" height="650" fill="#1a1a1a"/>

  <!-- LED Strip Lighting (wall) -->
  <rect x="0" y="600" width="1920" height="50" fill="#9B59B6" opacity="0.6"/>
  <rect x="0" y="0" width="1920" height="50" fill="#9B59B6" opacity="0.4"/>

  <!-- Gaming Desk -->
  <rect x="400" y="500" width="1100" height="40" fill="#2F4F4F" stroke="#000" stroke-width="4"/>
  <rect x="400" y="540" width="1100" height="350" fill="#1C1C1C" stroke="#000" stroke-width="4"/>

  <!-- Monitor (main, large) -->
  <rect x="650" y="250" width="650" height="400" fill="#000" stroke="#2F4F4F" stroke-width="6" rx="10"/>
  <!-- Screen -->
  <rect x="670" y="270" width="610" height="350" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <!-- Game on screen -->
  <rect x="690" y="290" width="570" height="310" fill="#4169E1"/>
  <rect x="750" y="350" width="100" height="150" fill="#FFD700"/>
  <rect x="950" y="380" width="120" height="120" fill="#FF6347"/>
  <text x="960" y="470" font-family="Arial" font-size="80" font-weight="bold" fill="#fff">GG</text>
  <!-- Monitor stand -->
  <rect x="930" y="650" width="80" height="50" fill="#2F4F4F" stroke="#000" stroke-width="3"/>
  <rect x="900" y="700" width="140" height="15" fill="#2F4F4F" stroke="#000" stroke-width="2" rx="7"/>

  <!-- Side Monitor (left) -->
  <rect x="100" y="350" width="450" height="300" fill="#000" stroke="#2F4F4F" stroke-width="5" rx="8"/>
  <rect x="115" y="365" width="420" height="265" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <rect x="130" y="380" width="390" height="235" fill="#32CD32"/>
  <text x="325" y="520" font-family="Arial" font-size="60" font-weight="bold" fill="#000" text-anchor="middle">CHAT</text>

  <!-- Side Monitor (right) -->
  <rect x="1380" y="350" width="450" height="300" fill="#000" stroke="#2F4F4F" stroke-width="5" rx="8"/>
  <rect x="1395" y="365" width="420" height="265" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <rect x="1410" y="380" width="390" height="235" fill="#FF4500"/>
  <text x="1605" y="520" font-family="Arial" font-size="60" font-weight="bold" fill="#fff" text-anchor="middle">STREAM</text>

  <!-- Keyboard -->
  <rect x="600" y="720" width="450" height="150" fill="#1C1C1C" stroke="#000" stroke-width="3" rx="8"/>
  <!-- RGB lighting effect -->
  <rect x="610" y="730" width="430" height="10" fill="#9B59B6" opacity="0.8"/>
  <rect x="610" y="750" width="430" height="10" fill="#FF1493" opacity="0.8"/>
  <rect x="610" y="770" width="430" height="10" fill="#00CED1" opacity="0.8"/>
  <!-- Keys -->
  <g fill="#2F4F4F" stroke="#000" stroke-width="1">
    <rect x="620" y="795" width="30" height="30" rx="3"/>
    <rect x="660" y="795" width="30" height="30" rx="3"/>
    <rect x="700" y="795" width="30" height="30" rx="3"/>
    <rect x="740" y="795" width="30" height="30" rx="3"/>
    <rect x="780" y="795" width="30" height="30" rx="3"/>
    <rect x="620" y="835" width="30" height="30" rx="3"/>
    <rect x="660" y="835" width="30" height="30" rx="3"/>
    <rect x="700" y="835" width="30" height="30" rx="3"/>
    <rect x="740" y="835" width="30" height="30" rx="3"/>
    <rect x="780" y="835" width="150" height="30" rx="3"/>
  </g>

  <!-- Gaming Mouse -->
  <path d="M 1100 780 L 1100 850 Q 1100 870 1120 870 L 1180 870 Q 1200 870 1200 850 L 1200 780 Q 1200 760 1180 760 L 1120 760 Q 1100 760 1100 780 Z" fill="#2F4F4F" stroke="#000" stroke-width="3"/>
  <!-- RGB glow -->
  <ellipse cx="1150" cy="810" rx="30" ry="40" fill="#00CED1" opacity="0.6"/>
  <!-- Mouse buttons -->
  <line x1="1150" y1="760" x2="1150" y2="820" stroke="#000" stroke-width="2"/>
  <!-- Scroll wheel -->
  <rect x="1140" y="785" width="20" height="15" fill="#1C1C1C" stroke="#000" stroke-width="1" rx="3"/>

  <!-- Headset Stand -->
  <rect x="1300" y="550" width="20" height="170" fill="#2F4F4F" stroke="#000" stroke-width="2"/>
  <ellipse cx="1310" cy="550" rx="60" ry="15" fill="#2F4F4F" stroke="#000" stroke-width="2"/>
  <!-- Headset -->
  <path d="M 1250 560 Q 1250 510 1310 510 Q 1370 510 1370 560" fill="none" stroke="#DC143C" stroke-width="12"/>
  <ellipse cx="1265" cy="560" rx="25" ry="30" fill="#DC143C" stroke="#000" stroke-width="2"/>
  <ellipse cx="1355" cy="560" rx="25" ry="30" fill="#DC143C" stroke="#000" stroke-width="2"/>

  <!-- Gaming Chair (partial view) -->
  <rect x="600" y="900" width="400" height="150" fill="#DC143C" stroke="#8B0000" stroke-width="4" rx="20"/>
  <rect x="620" y="920" width="360" height="110" fill="#FF6347"/>
  <!-- Armrests -->
  <rect x="560" y="920" width="40" height="120" fill="#2F4F4F" stroke="#000" stroke-width="2" rx="8"/>
  <rect x="1000" y="920" width="40" height="120" fill="#2F4F4F" stroke="#000" stroke-width="2" rx="8"/>

  <!-- Posters on Wall -->
  <!-- Poster 1 -->
  <rect x="100" y="50" width="250" height="200" fill="#9B59B6" stroke="#000" stroke-width="4" rx="5"/>
  <text x="225" y="130" font-family="Arial" font-size="40" font-weight="bold" fill="#FFD700" text-anchor="middle">EPIC</text>
  <text x="225" y="180" font-family="Arial" font-size="40" font-weight="bold" fill="#FFD700" text-anchor="middle">GAMER</text>

  <!-- Poster 2 -->
  <rect x="1570" y="80" width="250" height="200" fill="#FF4500" stroke="#000" stroke-width="4" rx="5"/>
  <text x="1695" y="150" font-family="Arial" font-size="50" font-weight="bold" fill="#fff" text-anchor="middle">PWNED</text>
  <circle cx="1695" cy="220" r="30" fill="#FFD700"/>

  <!-- LED Light Strips on Desk -->
  <rect x="410" y="505" width="1080" height="5" fill="#9B59B6" opacity="0.8"/>

  <!-- Energy Drink Cans -->
  <rect x="1370" y="650" width="50" height="80" fill="#FFD700" stroke="#DAA520" stroke-width="2" rx="3"/>
  <rect x="1370" y="650" width="50" height="20" fill="#FF6347"/>

  <rect x="1440" y="650" width="50" height="80" fill="#00CED1" stroke="#008B8B" stroke-width="2" rx="3"/>
  <rect x="1440" y="650" width="50" height="20" fill="#FF1493"/>

  <!-- Controller on desk -->
  <ellipse cx="500" cy="680" rx="60" ry="40" fill="#2F4F4F" stroke="#000" stroke-width="3"/>
  <circle cx="480" cy="680" r="8" fill="#4169E1"/>
  <circle cx="520" cy="680" r="8" fill="#DC143C"/>
</svg>
