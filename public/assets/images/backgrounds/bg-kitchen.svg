<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Kitchen Background -->
  <!-- Floor -->
  <rect x="0" y="700" width="1920" height="380" fill="#E8D7C3"/>
  <!-- Floor tiles pattern -->
  <g opacity="0.3">
    <line x1="0" y1="780" x2="1920" y2="780" stroke="#C4A57B" stroke-width="3"/>
    <line x1="0" y1="860" x2="1920" y2="860" stroke="#C4A57B" stroke-width="3"/>
    <line x1="0" y1="940" x2="1920" y2="940" stroke="#C4A57B" stroke-width="3"/>
    <line x1="0" y1="1020" x2="1920" y2="1020" stroke="#C4A57B" stroke-width="3"/>
  </g>

  <!-- Wall -->
  <rect x="0" y="0" width="1920" height="700" fill="#FFE5CC"/>

  <!-- Cabinets (top) -->
  <rect x="100" y="50" width="400" height="300" fill="#8B4513" stroke="#654321" stroke-width="4" rx="8"/>
  <rect x="600" y="50" width="500" height="300" fill="#8B4513" stroke="#654321" stroke-width="4" rx="8"/>
  <rect x="1200" y="50" width="400" height="300" fill="#8B4513" stroke="#654321" stroke-width="4" rx="8"/>

  <!-- Cabinet handles (top) -->
  <rect x="280" y="190" width="40" height="8" fill="#C0C0C0" stroke="#000" stroke-width="2" rx="4"/>
  <rect x="830" y="190" width="40" height="8" fill="#C0C0C0" stroke="#000" stroke-width="2" rx="4"/>
  <rect x="1380" y="190" width="40" height="8" fill="#C0C0C0" stroke="#000" stroke-width="2" rx="4"/>

  <!-- Counter -->
  <rect x="0" y="500" width="1920" height="200" fill="#A9A9A9" stroke="#808080" stroke-width="4"/>
  <rect x="0" y="500" width="1920" height="30" fill="#C0C0C0"/>

  <!-- Cabinets (bottom) -->
  <rect x="100" y="700" width="400" height="350" fill="#8B4513" stroke="#654321" stroke-width="4"/>
  <rect x="600" y="700" width="500" height="350" fill="#8B4513" stroke="#654321" stroke-width="4"/>
  <rect x="1200" y="700" width="400" height="350" fill="#8B4513" stroke="#654321" stroke-width="4"/>

  <!-- Cabinet handles (bottom) -->
  <rect x="280" y="860" width="40" height="8" fill="#C0C0C0" stroke="#000" stroke-width="2" rx="4"/>
  <rect x="830" y="860" width="40" height="8" fill="#C0C0C0" stroke="#000" stroke-width="2" rx="4"/>
  <rect x="1380" y="860" width="40" height="8" fill="#C0C0C0" stroke="#000" stroke-width="2" rx="4"/>

  <!-- Sink -->
  <ellipse cx="850" cy="600" rx="120" ry="80" fill="#E0E0E0" stroke="#808080" stroke-width="4"/>
  <ellipse cx="850" cy="595" rx="110" ry="70" fill="#B0B0B0"/>

  <!-- Faucet -->
  <rect x="840" y="520" width="20" height="80" fill="#C0C0C0" stroke="#808080" stroke-width="2" rx="4"/>
  <path d="M 850 520 Q 830 500 830 480 L 870 480 Q 870 500 850 520" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>

  <!-- Stove -->
  <rect x="1300" y="530" width="250" height="150" fill="#2C2C2C" stroke="#000" stroke-width="3" rx="8"/>
  <!-- Burners -->
  <circle cx="1360" cy="590" r="30" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="1360" cy="590" r="20" fill="#1a1a1a"/>
  <circle cx="1490" cy="590" r="30" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="1490" cy="590" r="20" fill="#1a1a1a"/>

  <!-- Microwave -->
  <rect x="1650" y="530" width="200" height="120" fill="#E0E0E0" stroke="#808080" stroke-width="3" rx="6"/>
  <rect x="1670" y="550" width="120" height="80" fill="#333" stroke="#000" stroke-width="2"/>
  <!-- Microwave buttons -->
  <circle cx="1810" cy="570" r="8" fill="#4A4A4A" stroke="#000" stroke-width="1"/>
  <circle cx="1810" cy="600" r="8" fill="#4A4A4A" stroke="#000" stroke-width="1"/>
  <circle cx="1810" cy="630" r="8" fill="#4A4A4A" stroke="#000" stroke-width="1"/>

  <!-- Window -->
  <rect x="700" y="100" width="500" height="350" fill="#87CEEB" stroke="#654321" stroke-width="6" rx="8"/>
  <!-- Window panes -->
  <line x1="950" y1="100" x2="950" y2="450" stroke="#654321" stroke-width="6"/>
  <line x1="700" y1="275" x2="1200" y2="275" stroke="#654321" stroke-width="6"/>
  <!-- Clouds in window -->
  <ellipse cx="800" cy="200" rx="40" ry="30" fill="#fff" opacity="0.7"/>
  <ellipse cx="830" cy="200" rx="35" ry="25" fill="#fff" opacity="0.7"/>
  <ellipse cx="1100" cy="250" rx="45" ry="32" fill="#fff" opacity="0.7"/>

  <!-- Items on counter -->
  <!-- Cutting board -->
  <rect x="200" y="540" width="100" height="140" fill="#D2691E" stroke="#8B4513" stroke-width="2" rx="8"/>

  <!-- Toaster -->
  <rect x="400" y="550" width="80" height="100" fill="#C0C0C0" stroke="#808080" stroke-width="2" rx="6"/>
  <rect x="410" y="560" width="25" height="70" fill="#333" stroke="#000" stroke-width="1"/>
  <rect x="445" y="560" width="25" height="70" fill="#333" stroke="#000" stroke-width="1"/>

  <!-- Fruit bowl -->
  <ellipse cx="1500" cy="620" rx="80" ry="40" fill="#FFD700" stroke="#DAA520" stroke-width="3"/>
  <!-- Fruits -->
  <circle cx="1470" cy="590" r="25" fill="#FF6347"/>
  <circle cx="1510" cy="585" r="25" fill="#FFA500"/>
  <circle cx="1530" cy="595" r="22" fill="#32CD32"/>
</svg>
