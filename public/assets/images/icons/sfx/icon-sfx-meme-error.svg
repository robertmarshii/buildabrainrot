<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Error Dialog Icon -->
  <style>
    svg { color: #DC143C; }
  </style>

  <!-- Error dialog window -->
  <rect x="30" y="50" width="140" height="110" fill="#C0C0C0" stroke="#000" stroke-width="3" rx="5"/>

  <!-- Title bar -->
  <rect x="30" y="50" width="140" height="25" fill="currentColor" stroke="#000" stroke-width="3" rx="5"/>
  <text x="50" y="68" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Error</text>

  <!-- Close button -->
  <rect x="155" y="55" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/>
  <line x1="157" y1="57" x2="165" y2="65" stroke="#000" stroke-width="2"/>
  <line x1="165" y1="57" x2="157" y2="65" stroke="#000" stroke-width="2"/>

  <!-- Error icon (X in circle) -->
  <circle cx="65" cy="110" r="20" fill="currentColor" stroke="#000" stroke-width="3"/>
  <line x1="55" y1="100" x2="75" y2="120" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="75" y1="100" x2="55" y2="120" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Error message text -->
  <text x="95" y="105" font-family="Arial" font-size="12" fill="#000">An error has</text>
  <text x="95" y="120" font-family="Arial" font-size="12" fill="#000">occurred!</text>

  <!-- OK button -->
  <rect x="70" y="135" width="60" height="20" fill="#D3D3D3" stroke="#000" stroke-width="2" rx="3"/>
  <text x="100" y="149" font-family="Arial" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">OK</text>

  <!-- Shadow effect -->
  <rect x="35" y="165" width="140" height="5" fill="#000" opacity="0.2" rx="2"/>
</svg>
