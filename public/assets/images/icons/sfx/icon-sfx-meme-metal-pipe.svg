<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Metal Pipe Falling Icon -->
  <style>
    svg { color: #708090; }
  </style>

  <!-- Metal pipe (diagonal, falling) -->
  <rect x="70" y="40" width="100" height="25" fill="currentColor" stroke="#000" stroke-width="3" rx="3" transform="rotate(45 120 90)"/>

  <!-- Pipe details/ridges -->
  <line x1="85" y1="65" x2="95" y2="75" stroke="#2F4F4F" stroke-width="2" transform="rotate(45 120 90)"/>
  <line x1="105" y1="65" x2="115" y2="75" stroke="#2F4F4F" stroke-width="2" transform="rotate(45 120 90)"/>
  <line x1="125" y1="65" x2="135" y2="75" stroke="#2F4F4F" stroke-width="2" transform="rotate(45 120 90)"/>
  <line x1="145" y1="65" x2="155" y2="75" stroke="#2F4F4F" stroke-width="2" transform="rotate(45 120 90)"/>

  <!-- Pipe highlight (metallic shine) -->
  <rect x="75" y="45" width="90" height="8" fill="#A9A9A9" opacity="0.6" rx="2" transform="rotate(45 120 90)"/>

  <!-- Motion blur lines (falling) -->
  <line x1="50" y1="30" x2="60" y2="40" stroke="currentColor" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="65" y1="40" x2="75" y2="50" stroke="currentColor" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="90" y2="60" stroke="currentColor" stroke-width="5" opacity="0.6" stroke-linecap="round"/>

  <!-- Impact ground -->
  <rect x="30" y="165" width="140" height="15" fill="#8B4513" stroke="#000" stroke-width="2"/>

  <!-- Impact effect -->
  <circle cx="140" cy="160" r="8" fill="#FFD700" opacity="0.7"/>
  <path d="M 130 150 L 125 145" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <path d="M 140 145 L 140 135" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150 150 L 155 145" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>

  <!-- Sound wave lines -->
  <path d="M 155 165 Q 165 160 170 155" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 160 172 Q 175 170 185 168" stroke="#000" stroke-width="2" stroke-linecap="round"/>

  <!-- "CLANG!" text -->
  <text x="100" y="195" font-family="Arial" font-size="22" font-weight="bold" fill="#000" text-anchor="middle">CLANG!</text>
</svg>
