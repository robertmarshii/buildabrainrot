<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Record Scratch Icon -->
  <style>
    svg { color: #000; }
  </style>

  <!-- Vinyl record -->
  <circle cx="100" cy="100" r="75" fill="currentColor" stroke="#333" stroke-width="3"/>

  <!-- Grooves (concentric circles) -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>

  <!-- Label (center) -->
  <circle cx="100" cy="100" r="25" fill="#DC143C" stroke="#000" stroke-width="2"/>
  <circle cx="100" cy="100" r="6" fill="#000"/>

  <!-- Label text -->
  <path d="M 85 95 Q 100 90 115 95" fill="none" stroke="#fff" stroke-width="1"/>
  <path d="M 87 100 Q 100 96 113 100" fill="none" stroke="#fff" stroke-width="1"/>
  <path d="M 89 105 Q 100 102 111 105" fill="none" stroke="#fff" stroke-width="1"/>

  <!-- Scratch mark (dramatic diagonal) -->
  <path d="M 55 65 L 145 135" stroke="#FFD700" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 53 67 L 143 137" stroke="#FFA500" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Scratch impact particles -->
  <circle cx="75" cy="85" r="3" fill="#FFD700"/>
  <circle cx="90" cy="95" r="2" fill="#FFD700"/>
  <circle cx="110" cy="105" r="3" fill="#FFD700"/>
  <circle cx="125" cy="115" r="2" fill="#FFD700"/>

  <!-- Motion lines -->
  <path d="M 45 55 L 35 45" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <path d="M 155 145 L 165 155" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>

  <!-- "SCREECH" text -->
  <text x="100" y="190" font-family="Arial" font-size="18" font-weight="bold" fill="#DC143C" text-anchor="middle">SCREECH</text>
</svg>
