<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Airhorn Icon -->
  <style>
    svg { color: #FF4500; }
  </style>

  <!-- Horn body -->
  <path d="M 60 80 L 60 120 L 120 150 L 120 50 Z" fill="currentColor" stroke="#000" stroke-width="3"/>

  <!-- Horn flare -->
  <ellipse cx="120" cy="100" rx="15" ry="50" fill="currentColor" stroke="#000" stroke-width="3"/>
  <path d="M 120 50 Q 150 50 170 100 Q 150 150 120 150" fill="#DC143C" stroke="#000" stroke-width="3"/>

  <!-- Handle -->
  <rect x="50" y="95" width="30" height="10" fill="#2F4F4F" stroke="#000" stroke-width="2" rx="5"/>

  <!-- Trigger -->
  <rect x="40" y="105" width="15" height="30" fill="#FFD700" stroke="#000" stroke-width="2" rx="3"/>

  <!-- Sound waves -->
  <path d="M 175 70 Q 185 70 190 60" fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <path d="M 175 85 Q 190 85 200 75" fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <path d="M 175 100 Q 195 100 205 100" fill="none" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <path d="M 175 115 Q 190 115 200 125" fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <path d="M 175 130 Q 185 130 190 140" fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
</svg>
