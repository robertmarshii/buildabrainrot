<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Applause - Clapping Hands Icon -->
  <style>
    svg { color: #FFD700; }
  </style>

  <!-- Left hand (palm facing right) -->
  <path d="M 40 100 Q 35 90 40 80 Q 45 70 55 70 Q 65 70 70 80 L 70 120 Q 65 130 55 130 Q 45 130 40 120 Z" fill="currentColor" stroke="#000" stroke-width="3"/>
  <!-- Left fingers -->
  <ellipse cx="70" cy="75" rx="8" ry="15" fill="currentColor" stroke="#000" stroke-width="2"/>
  <ellipse cx="70" cy="90" rx="8" ry="15" fill="currentColor" stroke="#000" stroke-width="2"/>
  <ellipse cx="70" cy="105" rx="8" ry="15" fill="currentColor" stroke="#000" stroke-width="2"/>

  <!-- Right hand (palm facing left) -->
  <path d="M 160 100 Q 165 90 160 80 Q 155 70 145 70 Q 135 70 130 80 L 130 120 Q 135 130 145 130 Q 155 130 160 120 Z" fill="currentColor" stroke="#000" stroke-width="3"/>
  <!-- Right fingers -->
  <ellipse cx="130" cy="75" rx="8" ry="15" fill="currentColor" stroke="#000" stroke-width="2"/>
  <ellipse cx="130" cy="90" rx="8" ry="15" fill="currentColor" stroke="#000" stroke-width="2"/>
  <ellipse cx="130" cy="105" rx="8" ry="15" fill="currentColor" stroke="#000" stroke-width="2"/>

  <!-- Clap impact lines -->
  <path d="M 90 60 L 100 45 L 110 60" fill="none" stroke="#DC143C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 85 75 L 95 60 L 105 75" fill="none" stroke="#DC143C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 90 90 L 100 75 L 110 90" fill="none" stroke="#DC143C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 85 105 L 95 90 L 105 105" fill="none" stroke="#DC143C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 90 120 L 100 105 L 110 120" fill="none" stroke="#DC143C" stroke-width="4" stroke-linecap="round"/>

  <!-- Sound wave -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#FFA500" stroke-width="3" opacity="0.5"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#FFA500" stroke-width="2" opacity="0.3"/>
</svg>
