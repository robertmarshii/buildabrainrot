<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Boing - Spring Icon -->
  <style>
    svg { color: #708090; }
  </style>

  <!-- Spring coils -->
  <path d="M 100 40 Q 70 50 100 65 Q 130 80 100 95 Q 70 110 100 125 Q 130 140 100 155" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>

  <!-- Spring top plate -->
  <ellipse cx="100" cy="35" rx="25" ry="8" fill="currentColor" stroke="#000" stroke-width="3"/>

  <!-- Spring bottom plate -->
  <ellipse cx="100" cy="165" rx="25" ry="8" fill="currentColor" stroke="#000" stroke-width="3"/>

  <!-- Motion lines (bouncing up) -->
  <path d="M 80 20 L 75 5" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <path d="M 100 15 L 100 0" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
  <path d="M 120 20 L 125 5" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>

  <!-- "BOING!" text -->
  <text x="140" y="100" font-family="Arial" font-size="25" font-weight="bold" fill="#FFD700" transform="rotate(-15 140 100)">BOING!</text>
</svg>
