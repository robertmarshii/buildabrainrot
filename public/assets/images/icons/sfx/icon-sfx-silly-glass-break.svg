<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Glass Break - Shattered Glass Icon -->
  <style>
    svg { color: #87CEEB; }
  </style>

  <!-- Broken glass shards (with crack pattern) -->
  <!-- Center impact point -->
  <circle cx="100" cy="100" r="8" fill="#000"/>

  <!-- Radiating cracks -->
  <line x1="100" y1="100" x2="100" y2="30" stroke="#000" stroke-width="3"/>
  <line x1="100" y1="100" x2="150" y2="50" stroke="#000" stroke-width="3"/>
  <line x1="100" y1="100" x2="170" y2="100" stroke="#000" stroke-width="3"/>
  <line x1="100" y1="100" x2="150" y2="150" stroke="#000" stroke-width="3"/>
  <line x1="100" y1="100" x2="100" y2="170" stroke="#000" stroke-width="3"/>
  <line x1="100" y1="100" x2="50" y2="150" stroke="#000" stroke-width="3"/>
  <line x1="100" y1="100" x2="30" y2="100" stroke="#000" stroke-width="3"/>
  <line x1="100" y1="100" x2="50" y2="50" stroke="#000" stroke-width="3"/>

  <!-- Secondary cracks -->
  <line x1="75" y1="65" x2="50" y2="40" stroke="#000" stroke-width="2"/>
  <line x1="125" y1="65" x2="140" y2="35" stroke="#000" stroke-width="2"/>
  <line x1="135" y1="100" x2="155" y2="75" stroke="#000" stroke-width="2"/>
  <line x1="135" y1="125" x2="160" y2="140" stroke="#000" stroke-width="2"/>
  <line x1="75" y1="135" x2="60" y2="160" stroke="#000" stroke-width="2"/>
  <line x1="65" y1="100" x2="40" y2="85" stroke="#000" stroke-width="2"/>

  <!-- Glass shards (triangular pieces with blue tint) -->
  <path d="M 100 30 L 85 60 L 100 70 Z" fill="currentColor" opacity="0.6" stroke="#000" stroke-width="2"/>
  <path d="M 100 30 L 115 60 L 100 70 Z" fill="currentColor" opacity="0.5" stroke="#000" stroke-width="2"/>
  <path d="M 150 50 L 125 80 L 140 95 Z" fill="currentColor" opacity="0.6" stroke="#000" stroke-width="2"/>
  <path d="M 170 100 L 135 110 L 145 125 Z" fill="currentColor" opacity="0.5" stroke="#000" stroke-width="2"/>
  <path d="M 150 150 L 115 125 L 125 140 Z" fill="currentColor" opacity="0.6" stroke="#000" stroke-width="2"/>
  <path d="M 100 170 L 110 135 L 95 135 Z" fill="currentColor" opacity="0.5" stroke="#000" stroke-width="2"/>
  <path d="M 50 150 L 75 120 L 65 135 Z" fill="currentColor" opacity="0.6" stroke="#000" stroke-width="2"/>
  <path d="M 30 100 L 65 105 L 55 90 Z" fill="currentColor" opacity="0.5" stroke="#000" stroke-width="2"/>
  <path d="M 50 50 L 75 75 L 70 60 Z" fill="currentColor" opacity="0.6" stroke="#000" stroke-width="2"/>

  <!-- Glass shine/highlights -->
  <path d="M 95 50 L 90 55" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <path d="M 130 70 L 125 75" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <path d="M 145 110 L 140 115" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <path d="M 70 125 L 65 130" stroke="#fff" stroke-width="2" opacity="0.8"/>
</svg>
