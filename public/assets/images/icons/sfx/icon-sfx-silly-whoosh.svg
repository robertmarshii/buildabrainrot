<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Whoosh - Speed Lines Icon -->
  <style>
    svg { color: #4169E1; }
  </style>

  <!-- Fast moving object (blur) -->
  <ellipse cx="150" cy="100" rx="30" ry="35" fill="currentColor" opacity="0.8" stroke="#000" stroke-width="3"/>
  <ellipse cx="140" cy="100" rx="25" ry="30" fill="#87CEEB" opacity="0.6"/>

  <!-- Speed/motion lines -->
  <path d="M 20 60 L 100 65" stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M 10 80 L 110 82" stroke="currentColor" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 5 100 L 120 100" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
  <path d="M 10 120 L 110 118" stroke="currentColor" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 20 140 L 100 135" stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Additional trailing lines -->
  <path d="M 30 70 L 90 72" stroke="#87CEEB" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M 25 90 L 95 91" stroke="#87CEEB" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 30 110 L 95 109" stroke="#87CEEB" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 30 130 L 90 128" stroke="#87CEEB" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Small wind particles -->
  <circle cx="70" cy="75" r="3" fill="currentColor" opacity="0.5"/>
  <circle cx="55" cy="95" r="4" fill="currentColor" opacity="0.6"/>
  <circle cx="65" cy="115" r="3" fill="currentColor" opacity="0.5"/>
  <circle cx="75" cy="125" r="2" fill="currentColor" opacity="0.4"/>
</svg>
