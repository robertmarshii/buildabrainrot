<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Clown Emoji -->
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>
  <!-- Face -->
  <circle cx="100" cy="100" r="90" fill="#FFD700" stroke="#E6A800" stroke-width="3" filter="url(#shadow)"/>
  <!-- Red nose -->
  <circle cx="100" cy="105" r="18" fill="#FF0000" stroke="#CC0000" stroke-width="2"/>
  <!-- Nose highlight -->
  <circle cx="94" cy="99" r="5" fill="#FF6666" opacity="0.7"/>
  <!-- Eyes -->
  <circle cx="70" cy="75" r="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="130" cy="75" r="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="70" cy="77" r="6" fill="#000"/>
  <circle cx="130" cy="77" r="6" fill="#000"/>
  <!-- Eyebrows (arched) -->
  <path d="M 55 58 Q 70 48 85 58" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 115 58 Q 130 48 145 58" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- Big clown smile -->
  <path d="M 50 125 Q 100 170 150 125" fill="#FF0000" stroke="#CC0000" stroke-width="3"/>
  <!-- Hair tufts -->
  <circle cx="25" cy="55" r="15" fill="#0066FF"/>
  <circle cx="175" cy="55" r="15" fill="#0066FF"/>
  <circle cx="15" cy="75" r="12" fill="#0066FF"/>
  <circle cx="185" cy="75" r="12" fill="#0066FF"/>
</svg>
