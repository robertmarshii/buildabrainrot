<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Exploding Head / Mind Blown Emoji -->
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>
  <!-- Explosion rays -->
  <polygon points="100,5 110,55 140,15 120,60 170,35 125,70 190,65 130,80 195,100 130,100 190,135 125,115 170,165 115,125 140,185 105,130 100,195 95,130 60,185 85,125 30,165 75,115 10,135 70,100 5,100 70,80 10,65 75,70 30,35 80,60 60,15 90,55"
          fill="#FF6B35" opacity="0.8"/>
  <!-- Face -->
  <circle cx="100" cy="100" r="65" fill="#FFD700" stroke="#E6A800" stroke-width="3" filter="url(#shadow)"/>
  <!-- Crack line -->
  <path d="M 55 40 L 75 70 L 60 85 L 80 100 L 65 120" fill="none" stroke="#FF4500" stroke-width="3"/>
  <!-- Eyes (wide open shocked) -->
  <circle cx="75" cy="90" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="125" cy="90" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="75" cy="90" r="7" fill="#000"/>
  <circle cx="125" cy="90" r="7" fill="#000"/>
  <!-- Mouth (open shock) -->
  <ellipse cx="100" cy="130" rx="20" ry="15" fill="#2C2C2C" stroke="#000" stroke-width="2"/>
</svg>
