<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sunglasses Cool Emoji -->
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>
  <!-- Face -->
  <circle cx="100" cy="100" r="90" fill="#FFD700" stroke="#E6A800" stroke-width="3" filter="url(#shadow)"/>
  <!-- Sunglasses frame -->
  <rect x="35" y="70" width="55" height="35" rx="8" fill="#1A1A1A" stroke="#000" stroke-width="2"/>
  <rect x="110" y="70" width="55" height="35" rx="8" fill="#1A1A1A" stroke="#000" stroke-width="2"/>
  <!-- Bridge -->
  <path d="M 90 85 Q 100 80 110 85" fill="none" stroke="#1A1A1A" stroke-width="4"/>
  <!-- Lens shine -->
  <rect x="40" y="74" width="15" height="8" rx="4" fill="#444" opacity="0.6"/>
  <rect x="115" y="74" width="15" height="8" rx="4" fill="#444" opacity="0.6"/>
  <!-- Smirk -->
  <path d="M 65 130 Q 100 155 135 130" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
</svg>
